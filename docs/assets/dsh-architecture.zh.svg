<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">npm-safe for DSH 请求路径</title>
  <desc id="desc">DSH 智能体调用 tool-npm-safe 工具包中的 14 个工具之一；兼容层转发到固定版本的 @npm-safe/core 扫描器，读取 npm 元数据和已发布 tarball，并向智能体返回发现、等级和评分。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5b6b78"/>
    </marker>
    <style>
      .sans { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", "Segoe UI", sans-serif; }
      .mono { font-family: "IBM Plex Mono", "Cascadia Mono", "Consolas", monospace; }
      .white { fill: #e8eef2; }
      .body { fill: #a9b7c2; }
      .muted { fill: #8b98a3; }
    </style>
  </defs>
  <rect width="1200" height="560" fill="#0f1216"/>

  <text x="40" y="42" class="sans muted" font-size="12" letter-spacing="2">NPM-SAFE FOR DSH / 请求路径</text>
  <text x="40" y="74" class="sans white" font-size="22" font-weight="700">一次工具调用，四跳，一份带证据的结论</text>
  <text x="1160" y="42" text-anchor="end" class="sans muted" font-size="12">静态优先 · 按需深扫</text>

  <!-- 01 agent -->
  <g>
    <rect x="40" y="110" width="230" height="270" rx="16" fill="#151a1f" stroke="#2a3138"/>
    <rect x="40" y="110" width="6" height="270" rx="3" fill="#6ea8fe"/>
    <text x="66" y="142" class="sans muted" font-size="11" letter-spacing="1.5">01 / 智能体</text>
    <text x="66" y="174" class="sans white" font-size="18" font-weight="700">DSH 智能体</text>
    <text x="66" y="206" class="sans body" font-size="12.5">选择工具并读取</text>
    <text x="66" y="226" class="sans body" font-size="12.5">返回的证据。</text>
    <rect x="60" y="266" width="190" height="82" rx="10" fill="#101820" stroke="#2b3a4a"/>
    <text x="74" y="292" class="sans" fill="#c7d7e8" font-size="11.5">「安装 fast-glob 前先</text>
    <text x="74" y="311" class="sans" fill="#c7d7e8" font-size="11.5">深扫，并解释发现。」</text>
    <text x="74" y="332" class="sans muted" font-size="10">同一轮会话内返回</text>
    <text x="66" y="368" class="sans muted" font-size="11">由模型决定何时调用</text>
  </g>

  <!-- 02 tool bundle -->
  <g>
    <rect x="290" y="110" width="280" height="270" rx="16" fill="#151a1f" stroke="#2a3138"/>
    <rect x="290" y="110" width="6" height="270" rx="3" fill="#5ec99d"/>
    <text x="316" y="142" class="sans muted" font-size="11" letter-spacing="1.5">02 / 工具包</text>
    <text x="316" y="174" class="sans white" font-size="18" font-weight="700">tool-npm-safe</text>
    <text x="316" y="198" class="sans muted" font-size="11">14 个工具 · 原生 DSH bundle</text>
    <circle cx="322" cy="226" r="3" fill="#5ec99d"/>
    <text x="334" y="230" class="mono" fill="#c7d7e8" font-size="11.5">check_package · check_packages</text>
    <circle cx="322" cy="250" r="3" fill="#5ec99d"/>
    <text x="334" y="254" class="mono" fill="#c7d7e8" font-size="11.5">ci_scan · search_packages</text>
    <circle cx="322" cy="274" r="3" fill="#5ec99d"/>
    <text x="334" y="278" class="mono" fill="#c7d7e8" font-size="11.5">watch_* · rules_* · settings_*</text>
    <circle cx="322" cy="298" r="3" fill="#5ec99d"/>
    <text x="334" y="302" class="mono" fill="#c7d7e8" font-size="11.5">refresh_all（后台任务）</text>
    <text x="316" y="346" class="sans body" font-size="11.5">前台工具会转发取消信号。</text>
    <text x="316" y="364" class="sans muted" font-size="11">是否调用由智能体决定。</text>
  </g>

  <!-- 03 facade -->
  <g>
    <rect x="590" y="110" width="250" height="270" rx="16" fill="#151a1f" stroke="#2a3138"/>
    <rect x="590" y="110" width="6" height="270" rx="3" fill="#f0b46a"/>
    <text x="616" y="142" class="sans muted" font-size="11" letter-spacing="1.5">03 / 兼容层</text>
    <text x="616" y="176" class="mono white" font-size="14" font-weight="700">@npm-safe/core-dsh</text>
    <text x="616" y="200" class="sans body" font-size="12">薄兼容层</text>
    <text x="616" y="232" class="sans body" font-size="12">保留 search() 旧选项</text>
    <text x="616" y="254" class="sans body" font-size="12">ci_scan 报告结构</text>
    <text x="616" y="276" class="sans body" font-size="12">不含扫描或缓存代码</text>
    <text x="616" y="346" class="sans muted" font-size="11">依赖一个精确的核心版本</text>
  </g>

  <!-- 04 core -->
  <g>
    <rect x="860" y="110" width="300" height="270" rx="16" fill="#151a1f" stroke="#2a3138"/>
    <rect x="860" y="110" width="6" height="270" rx="3" fill="#b28df5"/>
    <text x="886" y="142" class="sans muted" font-size="11" letter-spacing="1.5">04 / 共享核心</text>
    <text x="886" y="176" class="mono white" font-size="15" font-weight="700">@npm-safe/core 2.0.2</text>
    <text x="886" y="208" class="sans body" font-size="12">10 条元数据规则</text>
    <text x="886" y="230" class="sans body" font-size="12">17 条深度内容规则</text>
    <text x="886" y="252" class="sans body" font-size="12">SQLite 缓存 · TTL</text>
    <text x="886" y="274" class="sans body" font-size="12">lockfile 遍历 · CI 门禁</text>
    <text x="886" y="296" class="sans body" font-size="12">源码复核默认关闭</text>
    <text x="886" y="346" class="sans muted" font-size="11">vendor tarball + SHA-512</text>
  </g>

  <!-- flow arrows -->
  <line x1="270" y1="245" x2="284" y2="245" stroke="#5b6b78" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="570" y1="245" x2="584" y2="245" stroke="#5b6b78" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="840" y1="245" x2="854" y2="245" stroke="#5b6b78" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- sources -->
  <g>
    <rect x="860" y="410" width="145" height="72" rx="12" fill="#101820" stroke="#2b3a4a"/>
    <text x="874" y="434" class="sans muted" font-size="9.5" letter-spacing="1">来源 1</text>
    <text x="874" y="456" class="sans white" font-size="12.5">npm registry</text>
    <text x="874" y="472" class="sans muted" font-size="10.5">包元数据</text>
    <rect x="1015" y="410" width="145" height="72" rx="12" fill="#101820" stroke="#2b3a4a"/>
    <text x="1029" y="434" class="sans muted" font-size="9.5" letter-spacing="1">来源 2</text>
    <text x="1029" y="456" class="sans white" font-size="12.5">已发布 tarball</text>
    <text x="1029" y="472" class="sans muted" font-size="10.5">完整性校验</text>
    <line x1="932" y1="410" x2="932" y2="386" stroke="#5b6b78" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="1087" y1="410" x2="1087" y2="386" stroke="#5b6b78" stroke-width="1.4" marker-end="url(#arrow)"/>
  </g>

  <!-- return path -->
  <path d="M 1087 482 V 510 H 155 V 386" fill="none" stroke="#5b6b78" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="432" y="492" width="336" height="24" rx="8" fill="#0f1216"/>
  <text x="600" y="508" text-anchor="middle" class="sans muted" font-size="11">发现 · 等级 · 评分 · 证据返回智能体</text>

  <text x="600" y="546" text-anchor="middle" class="sans muted" font-size="11.5">插件只注册工具，不拦截 npm、pnpm、yarn 或 dsh plugin 安装命令。</text>
</svg>
