<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">npm-safe for DeepSeek Harness banner</title>
  <desc id="desc">Banner for the npm-safe-forDSH plugin: check before your agent installs. 14 agent tools, 27 security rules, integrity-verified deep scans, local SQLite cache.</desc>
  <defs>
    <style>
      .sans { font-family: "IBM Plex Sans", "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .mono { font-family: "IBM Plex Mono", "Cascadia Mono", "Consolas", monospace; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="300" rx="20" fill="#f7f9fb" stroke="#dbe2ea"/>

  <text x="60" y="62" class="mono" fill="#5b6b78" font-size="12" letter-spacing="2">NPM-SAFE FOR DEEPSEEK HARNESS</text>
  <text x="60" y="118" class="sans" fill="#16202b" font-size="40" font-weight="700">Check before your agent installs.</text>
  <text x="60" y="152" class="sans" fill="#3d4c59" font-size="15">npm supply-chain security tools for DSH agents — evidence, level and score in the same turn.</text>

  <g class="mono" font-size="12">
    <rect x="60" y="188" width="176" height="36" rx="18" fill="#eef4fd" stroke="#bcd3f2"/>
    <text x="148" y="211" text-anchor="middle" fill="#1d4f91">14 agent tools</text>
    <rect x="250" y="188" width="196" height="36" rx="18" fill="#e9f7f0" stroke="#bfe3d2"/>
    <text x="348" y="211" text-anchor="middle" fill="#0f7a4d">27 security rules</text>
    <rect x="460" y="188" width="216" height="36" rx="18" fill="#fdf3e6" stroke="#ecd4ae"/>
    <text x="568" y="211" text-anchor="middle" fill="#96660f">integrity-verified deep scan</text>
    <rect x="690" y="188" width="186" height="36" rx="18" fill="#f3eefd" stroke="#d8c9f2"/>
    <text x="783" y="211" text-anchor="middle" fill="#6d3fc0">local SQLite cache</text>
  </g>
  <text x="60" y="262" class="sans" fill="#5b6b78" font-size="12">Tools only — the plugin never intercepts install commands; your agent or CI enforces the policy.</text>

  <g>
    <rect x="920" y="64" width="220" height="46" rx="10" fill="#ffffff" stroke="#d5dde5"/>
    <rect x="920" y="64" width="5" height="46" rx="2.5" fill="#2563eb"/>
    <text x="940" y="92" class="sans" fill="#16202b" font-size="13.5" font-weight="700">DSH agent</text>

    <rect x="920" y="128" width="220" height="46" rx="10" fill="#ffffff" stroke="#d5dde5"/>
    <rect x="920" y="128" width="5" height="46" rx="2.5" fill="#0f9d6a"/>
    <text x="940" y="156" class="sans" fill="#16202b" font-size="13.5" font-weight="700">tool-npm-safe</text>

    <rect x="920" y="192" width="220" height="46" rx="10" fill="#ffffff" stroke="#d5dde5"/>
    <rect x="920" y="192" width="5" height="46" rx="2.5" fill="#7c3aed"/>
    <text x="940" y="220" class="sans" fill="#16202b" font-size="13.5" font-weight="700">pinned @npm-safe/core</text>

    <line x1="1030" y1="110" x2="1030" y2="124" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="1030" y1="174" x2="1030" y2="188" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  </g>
</svg>
