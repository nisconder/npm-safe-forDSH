<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Example check_package deep-scan result</title>
  <desc id="desc">A real deep scan of fast-glob 3.3.3 returns level safe, score 97 out of 100, one low finding about non-standard build metadata, 53 scanned files and verified integrity.</desc>
  <defs>
    <style>
      .sans { font-family: "IBM Plex Sans", "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .mono { font-family: "IBM Plex Mono", "Cascadia Mono", "Consolas", monospace; }
      .white { fill: #e8eef2; }
      .body { fill: #a9b7c2; }
      .muted { fill: #8b98a3; }
    </style>
  </defs>
  <rect width="1200" height="520" fill="#0f1216"/>

  <text x="40" y="42" class="mono muted" font-size="12" letter-spacing="2">CHECK_PACKAGE / DEEP SCAN</text>
  <text x="1160" y="42" text-anchor="end" class="mono muted" font-size="12">ACTUAL RUN · 2026-11-13</text>

  <!-- result card -->
  <rect x="40" y="80" width="740" height="400" rx="18" fill="#151a1f" stroke="#2a3138"/>
  <text x="76" y="118" class="mono muted" font-size="11" letter-spacing="1.5">RESULT</text>
  <text x="76" y="160" class="sans white" font-size="28" font-weight="700">fast-glob@3.3.3</text>

  <rect x="592" y="102" width="156" height="62" rx="12" fill="#12251d" stroke="#3f8f6f"/>
  <text x="670" y="132" text-anchor="middle" class="sans" fill="#5ec99d" font-size="20" font-weight="700" letter-spacing="1">SAFE</text>
  <text x="670" y="153" text-anchor="middle" class="mono" fill="#5ec99d" font-size="12">97 / 100</text>

  <text x="76" y="194" class="mono muted" font-size="11.5">deep scan complete · 53 files · integrity verified</text>
  <line x1="76" y1="214" x2="744" y2="214" stroke="#2a3138"/>

  <text x="76" y="244" class="mono muted" font-size="11" letter-spacing="1.5">FINDINGS · 1</text>

  <rect x="76" y="258" width="668" height="110" rx="12" fill="#10151a" stroke="#2a3138"/>
  <rect x="92" y="274" width="50" height="22" rx="6" fill="#1b2a3a" stroke="#3b6f9e"/>
  <text x="117" y="290" text-anchor="middle" class="mono" fill="#93c5fd" font-size="10.5" letter-spacing="1">LOW</text>
  <text x="156" y="290" class="mono" fill="#dbe7ef" font-size="12.5">suspicious-build-metadata</text>
  <text x="92" y="324" class="sans body" font-size="12.5">Non-standard metadata field "_hasShrinkwrap"</text>
  <text x="92" y="343" class="sans body" font-size="12.5">present in package.json.</text>

  <text x="76" y="402" class="sans muted" font-size="11.5">Every rendered field is length-capped before it reaches the model.</text>
  <text x="76" y="422" class="sans muted" font-size="11.5">Findings are ranked by severity; deep scans carry file and line evidence.</text>
  <text x="76" y="450" class="mono" fill="#5ec99d" font-size="11">no install command is run</text>

  <!-- model view -->
  <rect x="810" y="80" width="350" height="400" rx="18" fill="#151a1f" stroke="#2a3138"/>
  <text x="838" y="118" class="mono muted" font-size="11" letter-spacing="1.5">MODEL RECEIVES</text>
  <line x1="838" y1="134" x2="1132" y2="134" stroke="#2a3138"/>

  <text x="838" y="166" class="sans muted" font-size="12">level</text>
  <text x="1132" y="166" text-anchor="end" class="mono white" font-size="12.5">safe</text>
  <text x="838" y="200" class="sans muted" font-size="12">score</text>
  <text x="1132" y="200" text-anchor="end" class="mono white" font-size="12.5">97</text>
  <text x="838" y="234" class="sans muted" font-size="12">findingCount</text>
  <text x="1132" y="234" text-anchor="end" class="mono white" font-size="12.5">1</text>
  <text x="838" y="268" class="sans muted" font-size="12">deepScanStatus</text>
  <text x="1132" y="268" text-anchor="end" class="mono white" font-size="12.5">complete</text>
  <text x="838" y="302" class="sans muted" font-size="12">filesScanned</text>
  <text x="1132" y="302" text-anchor="end" class="mono white" font-size="12.5">53</text>
  <text x="838" y="336" class="sans muted" font-size="12">integrityVerified</text>
  <text x="1132" y="336" text-anchor="end" class="mono white" font-size="12.5">true</text>
  <text x="838" y="370" class="sans muted" font-size="12">findingsTruncated</text>
  <text x="1132" y="370" text-anchor="end" class="mono white" font-size="12.5">false</text>

  <line x1="838" y1="392" x2="1132" y2="392" stroke="#2a3138"/>
  <text x="838" y="416" class="sans body" font-size="11.5">verdict plus evidence, not a shell hook.</text>
  <text x="838" y="436" class="sans muted" font-size="11.5">The agent decides whether to install.</text>

  <text x="600" y="508" text-anchor="middle" class="sans muted" font-size="11.5">Actual deep-scan output from @npm-safe/core 2.0.0 on 2026-11-13. Evidence is not an install guarantee.</text>
</svg>
