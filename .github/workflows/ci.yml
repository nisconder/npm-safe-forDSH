name: ci
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        node: [22.19, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run test
